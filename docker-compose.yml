# Same hosting pattern as the rest of this repo's sites (sable, ai-company,
# halo4, ...): shared Traefik reverse proxy on the external `traefik-proxy`
# network, TLS via the `letsencrypt` certresolver, running on the shared
# Hostinger VPS (halovisionai.cloud).
#
# Also exposes a direct host port (47850, unique across every site in this
# repo — see the port survey in DEPLOY.md) so it's reachable at
# http://<VPS_IP>:47850 even before/without DNS or Traefik, matching how
# n8n/ai-company keep a fallback direct port alongside their Traefik labels.
# It's a static marketing page with nothing to steal — no auth needed on
# either path.
#   https://halovisionai.cloud/guardian/ -> this site (Traefik/TLS)
#   http://<VPS_IP>:47850                -> this site (direct, no TLS)

services:
  guardian-site:
    build: .
    container_name: guardian-site
    restart: unless-stopped
    networks:
      - traefik-proxy
    ports:
      - "47850:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.guardian-site.rule=Host(`halovisionai.cloud`) && PathPrefix(`/guardian`)
      - traefik.http.routers.guardian-site.entrypoints=websecure
      - traefik.http.routers.guardian-site.tls=true
      - traefik.http.routers.guardian-site.tls.certresolver=letsencrypt
      # Bare "/guardian" (ohne trailing slash) zuerst auf "/guardian/" umleiten:
      # index.html referenziert CSS/JS/Download relativ, das geht nur mit
      # korrektem Verzeichnis-Pfad in der Adressleiste. Gleiches Muster wie /riff.
      - traefik.http.middlewares.guardian-redirect.redirectregex.regex=^(https?://[^/]+)/guardian$$
      - traefik.http.middlewares.guardian-redirect.redirectregex.replacement=$${1}/guardian/
      - traefik.http.middlewares.guardian-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.guardian-strip.stripprefix.prefixes=/guardian
      - traefik.http.routers.guardian-site.middlewares=guardian-redirect,guardian-strip
      - traefik.http.services.guardian-site.loadbalancer.server.port=8080

networks:
  traefik-proxy:
    external: true
